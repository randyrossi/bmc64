name: Bug report
description: Report a problem or unexpected behaviour
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please provide a clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: pi-model
    attributes:
      label: Raspberry Pi Model
      description: Which Raspberry Pi model are you using?
      options:
        - Raspberry Pi Zero
        - Raspberry Pi Zero W
        - Raspberry Pi 1
        - Raspberry Pi 2
        - Raspberry Pi 3 Model B
        - Raspberry Pi 3 Model B+
        - Raspberry Pi 4
        - Other
    validations:
      required: true

  - type: input
    id: bmc64-version
    attributes:
      label: BMC64 Version
      description: BMC64 version or commit
    validations:
      required: true

  - type: input
    id: other-hardware
    attributes:
      label: Other relevant hardware or configuration

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Messages
      description: Please include any relevant logs, error messages, or console output.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add anything else that may help us understand or reproduce the problem.
