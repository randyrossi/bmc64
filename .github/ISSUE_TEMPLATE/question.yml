name: Question
description: Ask for help or guidance with the project
title: "[QUESTION] "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like help with? Please describe your question as clearly as possible and include what you are trying to achieve.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What Have You Tried?
      description: |
        Tell us what you have already tried, including any troubleshooting steps you have taken.
        If you followed a guide or instructions, please mention which one.

  - type: dropdown
    id: pi-model
    attributes:
      label: Raspberry Pi Model
      description: Which Raspberry Pi model are you using?
      options:
        - Raspberry Pi Zero
        - Raspberry Pi Zero W
        - Raspberry Pi Zero 2 W
        - Raspberry Pi 2
        - Raspberry Pi 3 Model B
        - Raspberry Pi 3 Model B+
        - Other
    validations:
      required: true

  - type: input
    id: bmc64-version
    attributes:
      label: BMC64 Version
      description: BMC64 version or commit
    validations:
      required: true

  - type: input
    id: other-hardware
    attributes:
      label: Other relevant hardware or configuration

  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: If relevant, include any logs, error messages, commands, or other output that may help us answer your question.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add any other details, screenshots, links, or context that may help us understand your question.
