name: Build

# Builds every board's kernels on each push and pull request, then puts
# them together into one SD card that starts on any supported Pi
# (make_release.sh, as c-cpp.yml does for a release from a tag).
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [pi0, pi2, pi3, pi4, pi5]

    steps:
      - name: Install dependencies
        run: |
             sudo apt-get update
             sudo apt-get install -y build-essential automake autoconf libtool pkg-config autoconf-archive autotools-dev xa65 make cmake automake m4 bison byacc flex texinfo

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ${{ matrix.board }}
        run: |
             ./make_all.sh ${{ matrix.board }}
             ./make_machines.sh ${{ matrix.board }}

      # Only for the sdcard job below; deleted once it has the files.
      - uses: actions/upload-artifact@v4
        with:
          name: kernels-${{ matrix.board }}
          path: |
            kernel*.img.*
            third_party/circle-stdlib/libs/circle/boot/armstub8-rpi4.bin
          if-no-files-found: error
          retention-days: 1

  sdcard:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: pi3

      - uses: actions/download-artifact@v4
        with:
          pattern: kernels-*

      # make_release.sh takes each board's files from a folder named after
      # it, and everything else from the pi3 checkout.
      - name: Put the kernels in place
        run: |
             for board in pi0 pi2 pi4 pi5
             do
               mv kernels-$board $board
             done
             cp -a kernels-pi3/. pi3/
             ls pi0 pi2 pi3/kernel* pi4 pi5

      - name: Make the SD card
        run: |
             ./pi3/make_release.sh
             mkdir sdcard
             unzip -q bmc64-*.files.zip -d sdcard

      - uses: actions/upload-artifact@v4
        with:
          name: bmc64-sdcard
          path: sdcard/
          if-no-files-found: error

      - uses: geekyeggo/delete-artifact@v5
        with:
          name: kernels-*
