name: C/C++ Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches source version
        env:
          ACTUAL_TAG: ${{ github.ref_name }}
        run: |
             source_version=$(sed -n 's/^#define VERSION_STRING "\(.*\)"$/\1/p' third_party/common/menu.c)
             expected_tag="v${source_version// /-}"

             if [[ -z "$source_version" ]]
             then
               echo "Could not read VERSION_STRING from third_party/common/menu.c"
               exit 1
             fi

             if [[ "$ACTUAL_TAG" != "$expected_tag" ]]
             then
               echo "Tag must be $expected_tag, but received $ACTUAL_TAG"
               exit 1
             fi

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [pi0, pi2, pi3, pi4, pi5]

    steps:
      - name: Install dependencies
        run: |
             sudo apt-get install -y build-essential automake autoconf libtool pkg-config autoconf-archive autotools-dev xa65 make cmake automake m4 bison byacc flex texinfo

      - name: Checkout for ${{ matrix.board }}
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ matrix.board }}

      - name: Build ${{ matrix.board }}
        working-directory: ${{ matrix.board }}
        env:
          BOARD: ${{ matrix.board }}
        run: |
             ./make_all.sh "$BOARD"
             ./make_machines.sh "$BOARD"

      - name: Upload kernels
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}
          # The Pi 4 also boots with Circle's ARM stub (make_release.sh).
          path: |
            ${{ matrix.board }}/*.img.*
            ${{ matrix.board }}/third_party/circle-stdlib/libs/circle/boot/armstub8-rpi4.bin
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release files
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: pi3

      - name: Download kernels
        uses: actions/download-artifact@v4
        with:
          pattern: pi*
          path: .
          merge-multiple: false

      - name: Zip release
        run: ./pi3/make_release.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BMC64 ${{ github.ref_name }}
          files: bmc64-*.files.zip
          generate_release_notes: false
          draft : true
