name: C/C++ Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
             sudo apt-get install -y build-essential automake autoconf libtool pkg-config autoconf-archive autotools-dev xa65 make cmake automake m4 bison byacc flex texinfo

      - name: Checkout for pi3
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: pi3

      - name: Checkout for pi2
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: pi2

      - name: Checkout for pi0
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: pi0

      - name: Verify tag matches source version
        working-directory: pi3
        env:
          ACTUAL_TAG: ${{ github.ref_name }}
        run: |
             source_version=$(sed -n 's/^#define VERSION_STRING "\(.*\)"$/\1/p' third_party/common/menu.c)
             expected_tag="v${source_version// /-}"

             if [[ -z "$source_version" ]]
             then
               echo "Could not read VERSION_STRING from third_party/common/menu.c"
               exit 1
             fi

             if [[ "$ACTUAL_TAG" != "$expected_tag" ]]
             then
               echo "Tag must be $expected_tag, but received $ACTUAL_TAG"
               exit 1
             fi

      - name: Build pi3
        working-directory: pi3
        run: |
             ./make_all.sh pi3
             ./make_machines.sh pi3

      - name: Build pi2
        working-directory: pi2
        run: |
             ./make_all.sh pi2
             ./make_machines.sh pi2

      - name: Build pi0
        working-directory: pi0
        run: |
             ./make_all.sh pi0
             ./make_machines.sh pi0

      - name: Zip release
        run: ./pi3/make_release.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bmc64-*.files.zip
          generate_release_notes: false
