name: Manual C/C++ Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [pi0, pi2, pi3, pi4, pi5]

    steps:
      - name: Install dependencies
        run: |
             sudo apt-get install -y build-essential automake autoconf libtool pkg-config autoconf-archive autotools-dev xa65 make cmake automake m4 bison byacc flex texinfo

      - name: Checkout for ${{ matrix.board }}
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ matrix.board }}

      - name: Build ${{ matrix.board }}
        working-directory: ${{ matrix.board }}
        env:
          BOARD: ${{ matrix.board }}
        run: |
             ./make_all.sh "$BOARD"
             ./make_machines.sh "$BOARD"

      - name: Upload kernels
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}
          # The Pi 4 also boots with Circle's ARM stub (make_release.sh).
          path: |
            ${{ matrix.board }}/*.img.*
            ${{ matrix.board }}/third_party/circle-stdlib/libs/circle/boot/armstub8-rpi4.bin
          if-no-files-found: error
          retention-days: 1

  package:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release files
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: pi3

      - name: Download kernels
        uses: actions/download-artifact@v4
        with:
          pattern: pi*
          path: .
          merge-multiple: false

      - name: Zip release
        run: ./pi3/make_release.sh

      - name: Upload release zip
        uses: actions/upload-artifact@v7
        with:
          path: bmc64-*.files.zip
          archive: false
          if-no-files-found: error
