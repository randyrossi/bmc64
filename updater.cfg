# BMC64 updater settings
#
# The updater has two parts:
#   - the updater built into BMC64, which applies /bmc64-update.zip at boot
#     (see docs/UPDATING.md);
#   - the Web UI's Update page, which lists releases from GitHub, checks a
#     downloaded release zip and uploads it as bmc64-update.zip.
#
# If you fork BMC64, set repo to your own GitHub repository, then build the
# list of official releases for it; see "Configuring The Updater" in
# docs/BUILDING.md, which also lists everything these settings change.

# on           the updater and the Web UI's Update page.
#
# kernel_only  the updater only, with no Update page in the WebUI: an update 
#              is just a release zip copied to the card as bmc64-update.zip, 
#              which BMC64 applies at boot.
#
# off          no updater at all: bmc64-update.zip is ignored. You can also 
#              just delete this file to disable the updater entirely.
updater = on

# The GitHub repository (owner/name) whose releases are official. 
#
# It is used for two things:
#   - the Update WebUI page (updater = on) lists and trusts its releases
#   - the release tools (tools/update/gen_update_manifest.py, run by
#     make_all.sh) find its newly published releases and add them to the
#     release history that every release's bmc64-manifest.txt is made from.
#
# With kernel_only, BMC64 itself never uses it: the kernel only reads the
# bmc64-update.zip on the card. Leave it empty to never contact GitHub. The
# Update WebUI page then shows no release list and recognises only the releases
# built into it, and the release history has to be kept by hand via
# (gen_update_manifest.py add). This setting is not used with "updater = off".
repo = randyrossi/bmc64
